<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chatbot">
        
        <div id="chat-input">
          <input type="text" placeholder="Type your question..." />
          <button>Ask</button>
          
        </div>

        <div id="chat-window">
          <div class="message bot">Hi! I'm your digital helper 🤖. Ask me anything!</div>
        </div>
        <div class="btn-cont">
          <p>FAQs</p>
          <button id="q1">How to recharge using paytm</button>
            <button id="q2">How do i send a photo on whatsapp</button>
            <button id="q3">What is google pay</button>
        </div>
      </div>
      <button class="ask">Ask Me</button>


      
      <script src="script.js"></script>
</body>
</html>
